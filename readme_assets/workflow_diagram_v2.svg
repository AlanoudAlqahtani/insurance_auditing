<svg viewBox="0 0 1310 900" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <defs>
    <marker id="arrowFwd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2c3e50"/>
    </marker>
    <marker id="arrowLoop" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a83232"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1310" height="900" fill="#ffffff"/>

  <!-- Region bands: step-shaped dev band (blue) + transfer band (green) -->
  <polygon points="0,115 1130,115 1130,460 715,460 715,800 0,800"
           fill="#eef5fb" stroke="#cfe0ec" stroke-width="1.5"/>
  <rect x="715" y="460" width="575" height="340" fill="#eef8ee" stroke="#cfe6cf" stroke-width="1.5"/>

  <text x="655" y="45" text-anchor="middle" font-size="24" font-weight="600" fill="#1f2d3d">Model Development &amp; Transfer Workflow</text>

  <text x="330" y="145" text-anchor="middle" font-size="14" font-style="italic" fill="#3a6ea5">H1 Development Loop — labelled ground truth, iterative diagnosis</text>
  <text x="1000" y="478" text-anchor="middle" font-size="12.5" font-style="italic" fill="#3d7a4a">H4 / H5 Transfer — unlabelled, one-shot structural &amp; behavioral validation</text>

  <!-- ============ ROW 1 ============ -->

  <rect x="20" y="185" width="120" height="70" rx="6" fill="#eef2f7" stroke="#5a7a99" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="80" y="214" text-anchor="middle" font-size="12" fill="#1f2d3d">HOSPITAL 1</text>
  <text x="80" y="230" text-anchor="middle" font-size="12" fill="#1f2d3d">LABELLED DEV SET</text>

  <rect x="155" y="185" width="120" height="70" rx="6" fill="#ffffff" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="215" y="225" text-anchor="middle" font-size="12.5" fill="#1f2d3d">Run Pipeline</text>

  <rect x="290" y="185" width="140" height="70" rx="6" fill="#ffffff" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="360" y="216" text-anchor="middle" font-size="12.5" fill="#1f2d3d">Compare Against</text>
  <text x="360" y="232" text-anchor="middle" font-size="12.5" fill="#1f2d3d">Ground Truth</text>

  <rect x="445" y="185" width="140" height="70" rx="6" fill="#ffffff" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="515" y="216" text-anchor="middle" font-size="12.5" fill="#1f2d3d">Identify Systematic</text>
  <text x="515" y="232" text-anchor="middle" font-size="12.5" fill="#1f2d3d">Failure</text>

  <rect x="600" y="185" width="160" height="70" rx="6" fill="#ffffff" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="680" y="216" text-anchor="middle" font-size="12.5" fill="#1f2d3d">Investigate Evidence</text>
  <text x="680" y="232" text-anchor="middle" font-size="12.5" fill="#1f2d3d">+ Assumptions</text>

  <!-- D1 -->
  <polygon points="850,170 925,220 850,270 775,220" fill="#fff4e0" stroke="#b8860b" stroke-width="1.5"/>
  <text x="850" y="216" text-anchor="middle" font-size="11.5" fill="#1f2d3d">Mechanism</text>
  <text x="850" y="230" text-anchor="middle" font-size="11.5" fill="#1f2d3d">understood?</text>

  <rect x="940" y="185" width="150" height="70" rx="6" fill="#ffffff" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="1015" y="216" text-anchor="middle" font-size="12.5" fill="#1f2d3d">Minimal Targeted</text>
  <text x="1015" y="232" text-anchor="middle" font-size="12.5" fill="#1f2d3d">Fix</text>

  <!-- Investigate Further (NO branch) -->
  <rect x="775" y="340" width="150" height="70" rx="6" fill="#ffffff" stroke="#a83232" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="850" y="371" text-anchor="middle" font-size="12.5" fill="#1f2d3d">Investigate</text>
  <text x="850" y="387" text-anchor="middle" font-size="12.5" fill="#1f2d3d">Further</text>

  <!-- ============ ROW 2 ============ -->

  <rect x="20" y="525" width="130" height="70" rx="6" fill="#ffffff" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="85" y="565" text-anchor="middle" font-size="12.5" fill="#1f2d3d">Regression Tests</text>

  <rect x="165" y="525" width="150" height="70" rx="6" fill="#ffffff" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="240" y="556" text-anchor="middle" font-size="12.5" fill="#1f2d3d">Re-run H1</text>
  <text x="240" y="572" text-anchor="middle" font-size="12.5" fill="#1f2d3d">Evaluation</text>

  <!-- D2 -->
  <polygon points="405,510 480,560 405,610 330,560" fill="#fff4e0" stroke="#b8860b" stroke-width="1.5"/>
  <text x="405" y="556" text-anchor="middle" font-size="11.5" fill="#1f2d3d">Regression-</text>
  <text x="405" y="570" text-anchor="middle" font-size="11.5" fill="#1f2d3d">safe?</text>

  <!-- Freeze (milestone, double border) -->
  <rect x="493" y="523" width="164" height="74" rx="7" fill="none" stroke="#b8860b" stroke-width="1"/>
  <rect x="495" y="525" width="160" height="70" rx="6" fill="#fffaf0" stroke="#b8860b" stroke-width="1.5"/>
  <text x="575" y="556" text-anchor="middle" font-size="12.5" fill="#1f2d3d">Freeze Validated</text>
  <text x="575" y="572" text-anchor="middle" font-size="12.5" fill="#1f2d3d">Architecture</text>

  <!-- H4 / H5 -->
  <rect x="760" y="485" width="130" height="60" rx="6" fill="#e8f5e9" stroke="#4a7c59" stroke-width="1.5"/>
  <text x="825" y="510" text-anchor="middle" font-size="12.5" fill="#1f2d3d">Hospital 4</text>
  <text x="825" y="526" text-anchor="middle" font-size="12.5" fill="#1f2d3d">Unlabelled</text>

  <rect x="760" y="575" width="130" height="60" rx="6" fill="#e8f5e9" stroke="#4a7c59" stroke-width="1.5"/>
  <text x="825" y="600" text-anchor="middle" font-size="12.5" fill="#1f2d3d">Hospital 5</text>
  <text x="825" y="616" text-anchor="middle" font-size="12.5" fill="#1f2d3d">Unlabelled</text>

  <!-- Structural checks -->
  <rect x="930" y="525" width="160" height="70" rx="6" fill="#ffffff" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="1010" y="556" text-anchor="middle" font-size="12.5" fill="#1f2d3d">Structural +</text>
  <text x="1010" y="572" text-anchor="middle" font-size="12.5" fill="#1f2d3d">Behavioral Checks</text>
  <text x="1010" y="612" text-anchor="middle" font-size="10" font-style="italic" fill="#4a4a4a">(no ground truth — not measured accuracy)</text>

  <!-- Final Submission -->
  <rect x="1125" y="525" width="130" height="70" rx="6" fill="#f4f9f4" stroke="#2c3e50" stroke-width="2"/>
  <text x="1190" y="565" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f2d3d">Final Submission</text>

  <!-- ============ FORWARD ARROWS (row1) ============ -->
  <g stroke="#2c3e50" stroke-width="1.6" fill="none" marker-end="url(#arrowFwd)">
    <line x1="140" y1="220" x2="153" y2="220"/>
    <line x1="275" y1="220" x2="288" y2="220"/>
    <line x1="430" y1="220" x2="443" y2="220"/>
    <line x1="585" y1="220" x2="598" y2="220"/>
    <line x1="760" y1="220" x2="773" y2="220"/>
    <line x1="925" y1="220" x2="938" y2="220"/>
    <!-- row1 -> row2 wrap connector -->
    <path d="M1015,255 L1015,300 L85,300 L85,523"/>
  </g>
  <circle cx="1015" cy="300" r="0" fill="none"/>

  <!-- ============ FORWARD ARROWS (row2) ============ -->
  <g stroke="#2c3e50" stroke-width="1.6" fill="none" marker-end="url(#arrowFwd)">
    <line x1="150" y1="560" x2="163" y2="560"/>
    <line x1="315" y1="560" x2="328" y2="560"/>
    <line x1="480" y1="560" x2="493" y2="560"/>
    <line x1="655" y1="560" x2="695" y2="560"/>
    <line x1="695" y1="560" x2="758" y2="515"/>
    <line x1="695" y1="560" x2="758" y2="605"/>
    <line x1="890" y1="515" x2="927" y2="558"/>
    <line x1="890" y1="605" x2="927" y2="562"/>
    <line x1="928" y1="560" x2="928" y2="560"/>
    <line x1="1090" y1="560" x2="1123" y2="560"/>
  </g>
  <circle cx="695" cy="560" r="3.5" fill="#2c3e50"/>

  <!-- YES/NO labels -->
  <text x="928" y="210" font-size="11.5" font-weight="600" fill="#3d7a4a">YES</text>
  <text x="860" y="290" font-size="11.5" font-weight="600" fill="#a83232">NO</text>
  <text x="663" y="550" font-size="11.5" font-weight="600" fill="#3d7a4a">YES</text>
  <text x="415" y="290" font-size="11.5" font-weight="600" fill="#a83232">NO</text>

  <!-- ============ LOOP / REJECT ARROWS ============ -->
  <g stroke="#a83232" stroke-width="1.6" fill="none" stroke-dasharray="7,4" marker-end="url(#arrowLoop)">
    <!-- D1 NO -> Investigate Further -->
    <path d="M850,270 L850,338"/>
    <!-- Investigate Further -> back to Investigate Evidence -->
    <path d="M775,375 L700,375 L700,257"/>
    <!-- D2 NO -> big loop back up to Compare Against Ground Truth (row1) -->
    <path d="M330,560 L180,560 L180,310 L360,310 L360,257"/>
  </g>

  <text x="705" y="320" text-anchor="middle" font-size="11" fill="#a83232">re-examine mechanism</text>
  <text x="270" y="335" text-anchor="middle" font-size="11.5" fill="#a83232">NO — regression detected → refine the fix</text>
  <text x="270" y="349" text-anchor="middle" font-size="11.5" fill="#a83232">(not a new metric search)</text>

  <!-- ============ LEGEND ============ -->
  <g font-size="12" fill="#1f2d3d">
    <line x1="60" y1="835" x2="110" y2="835" stroke="#2c3e50" stroke-width="1.6" marker-end="url(#arrowFwd)"/>
    <text x="120" y="839">forward flow / gate passed</text>

    <line x1="60" y1="860" x2="110" y2="860" stroke="#a83232" stroke-width="1.6" stroke-dasharray="7,4" marker-end="url(#arrowLoop)"/>
    <text x="120" y="864">loop-back — driven by mechanism understanding, not metric threshold-chasing</text>
  </g>

  <text x="655" y="890" text-anchor="middle" font-size="11.5" font-style="italic" fill="#4a4a4a">
    H1 provides ground truth for diagnosis and iterative validation. H4/H5 are unlabelled: passage is determined by structural and behavioral checks only — no accuracy is measured or implied.
  </text>

</svg>
