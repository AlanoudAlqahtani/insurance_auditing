<svg viewBox="0 0 1680 720" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <!-- ============ DEFS ============ -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a4a4a"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f5fa3"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1680" height="720" fill="#ffffff"/>

  <!-- ============ TITLE ============ -->
  <text x="40" y="40" font-size="19" font-weight="600" fill="#2b2b2b">Contract–Invoice Audit Pipeline</text>
  <text x="40" y="62" font-size="12.5" fill="#6b6b6b">Processing flow, evidence requirements, and propagation of uncertainty toward the final confidence assessment</text>

  <!-- ============ LEGEND ============ -->
  <g transform="translate(1250,20)">
    <line x1="0" y1="10" x2="26" y2="10" stroke="#4a4a4a" stroke-width="1.6" marker-end="url(#arrow)"/>
    <text x="34" y="14" font-size="11.5" fill="#4a4a4a">processing step</text>

    <circle cx="13" cy="34" r="8" fill="#ffffff" stroke="#2f5fa3" stroke-width="1.6"/>
    <text x="1" y="38" font-size="9" fill="#2f5fa3" text-anchor="middle">U</text>
    <text x="34" y="38" font-size="11.5" fill="#4a4a4a">uncertainty point</text>

    <line x1="0" y1="58" x2="26" y2="58" stroke="#2f5fa3" stroke-width="1.3" stroke-dasharray="2,3" marker-end="url(#arrowBlue)"/>
    <text x="34" y="62" font-size="11.5" fill="#4a4a4a">uncertainty propagation</text>

    <line x1="0" y1="82" x2="26" y2="82" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="34" y="86" font-size="11.5" fill="#4a4a4a">evidence dependency</text>
  </g>

  <!-- ============ ROW LABELS ============ -->
  <rect x="90" y="100" width="34" height="4" fill="#2f5fa3"/>
  <text x="90" y="95" font-size="11.5" font-weight="600" fill="#2f5fa3" letter-spacing="0.5">CONTRACT SIDE</text>

  <rect x="90" y="270" width="34" height="4" fill="#8a8a8a"/>
  <text x="90" y="265" font-size="11.5" font-weight="600" fill="#5a5a5a" letter-spacing="0.5">INVOICE SIDE</text>

  <!-- ============ NODE STYLE HELPER (manual rects) ============ -->

  <!-- Contract row (y ~150) -->
  <g>
    <rect x="90" y="120" width="170" height="60" rx="6" fill="#ffffff" stroke="#4a4a4a" stroke-width="1.3"/>
    <text x="175" y="145" font-size="13" fill="#2b2b2b" text-anchor="middle">Contract</text>
    <text x="175" y="162" font-size="13" fill="#2b2b2b" text-anchor="middle">Documents</text>
  </g>

  <line x1="260" y1="150" x2="330" y2="150" stroke="#4a4a4a" stroke-width="1.4" marker-end="url(#arrow)"/>

  <g>
    <rect x="335" y="120" width="180" height="60" rx="6" fill="#ffffff" stroke="#4a4a4a" stroke-width="1.3"/>
    <text x="425" y="145" font-size="13" fill="#2b2b2b" text-anchor="middle">Contract</text>
    <text x="425" y="162" font-size="13" fill="#2b2b2b" text-anchor="middle">Interpretation</text>
  </g>

  <line x1="515" y1="150" x2="560" y2="150" stroke="#4a4a4a" stroke-width="1.4"/>
  <circle cx="582" cy="150" r="15" fill="#ffffff" stroke="#2f5fa3" stroke-width="1.6"/>
  <text x="582" y="154" font-size="11" fill="#2f5fa3" text-anchor="middle" font-weight="600">U1</text>
  <line x1="597" y1="150" x2="650" y2="150" stroke="#4a4a4a" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="582" y="112" font-size="10.5" fill="#2f5fa3" text-anchor="middle" font-style="italic">Contract Interpretation</text>

  <g>
    <rect x="655" y="112" width="185" height="76" rx="6" fill="#ffffff" stroke="#4a4a4a" stroke-width="1.3"/>
    <text x="747" y="144" font-size="13" fill="#2b2b2b" text-anchor="middle">Structured</text>
    <text x="747" y="161" font-size="13" fill="#2b2b2b" text-anchor="middle">Contract Schema</text>
  </g>

  <!-- schema drops down to feed Service Resolution -->
  <path d="M747,188 L747,300" stroke="#4a4a4a" stroke-width="1.4" marker-end="url(#arrow)" fill="none"/>

  <!-- Invoice row (y ~320) -->
  <g>
    <rect x="90" y="290" width="170" height="60" rx="6" fill="#ffffff" stroke="#4a4a4a" stroke-width="1.3"/>
    <text x="175" y="315" font-size="13" fill="#2b2b2b" text-anchor="middle">Invoice +</text>
    <text x="175" y="332" font-size="13" fill="#2b2b2b" text-anchor="middle">Line Items</text>
  </g>

  <!-- split: down to validity checks, right to service resolution -->
  <path d="M175,350 L175,470 L330,470" stroke="#4a4a4a" stroke-width="1.4" marker-end="url(#arrow)" fill="none"/>
  <line x1="260" y1="320" x2="640" y2="320" stroke="#4a4a4a" stroke-width="1.4"/>
  <line x1="637" y1="320" x2="645" y2="320" stroke="#4a4a4a" stroke-width="1.4" marker-end="url(#arrow)"/>

  <g>
    <rect x="335" y="440" width="190" height="60" rx="6" fill="#ffffff" stroke="#4a4a4a" stroke-width="1.3"/>
    <text x="430" y="465" font-size="13" fill="#2b2b2b" text-anchor="middle">Validity / Arithmetic</text>
    <text x="430" y="482" font-size="13" fill="#2b2b2b" text-anchor="middle">Checks</text>
  </g>

  <g>
    <rect x="655" y="290" width="185" height="60" rx="6" fill="#ffffff" stroke="#4a4a4a" stroke-width="1.3"/>
    <text x="747" y="315" font-size="13" fill="#2b2b2b" text-anchor="middle">Service</text>
    <text x="747" y="332" font-size="13" fill="#2b2b2b" text-anchor="middle">Resolution</text>
  </g>

  <line x1="840" y1="320" x2="885" y2="320" stroke="#4a4a4a" stroke-width="1.4"/>
  <circle cx="907" cy="320" r="15" fill="#ffffff" stroke="#2f5fa3" stroke-width="1.6"/>
  <text x="907" y="324" font-size="11" fill="#2f5fa3" text-anchor="middle" font-weight="600">U2</text>
  <text x="907" y="282" font-size="10.5" fill="#2f5fa3" text-anchor="middle" font-style="italic">Service Mapping</text>
  <line x1="922" y1="320" x2="975" y2="320" stroke="#4a4a4a" stroke-width="1.4" marker-end="url(#arrow)"/>

  <g>
    <rect x="980" y="290" width="180" height="60" rx="6" fill="#ffffff" stroke="#4a4a4a" stroke-width="1.3"/>
    <text x="1070" y="315" font-size="13" fill="#2b2b2b" text-anchor="middle">Contractual</text>
    <text x="1070" y="332" font-size="13" fill="#2b2b2b" text-anchor="middle">Pricing</text>
  </g>

  <!-- Contractual pricing + Validity checks converge -->
  <path d="M1070,350 L1070,470 L1160,470" stroke="#4a4a4a" stroke-width="1.4" fill="none"/>
  <circle cx="1182" cy="470" r="15" fill="#ffffff" stroke="#2f5fa3" stroke-width="1.6"/>
  <text x="1182" y="474" font-size="11" fill="#2f5fa3" text-anchor="middle" font-weight="600">U3</text>
  <text x="1182" y="503" font-size="10.5" fill="#2f5fa3" text-anchor="middle" font-style="italic">Rule Application</text>

  <path d="M525,470 L1155,470" stroke="#4a4a4a" stroke-width="1.4" fill="none"/>
  <line x1="1197" y1="470" x2="1250" y2="470" stroke="#4a4a4a" stroke-width="1.4" marker-end="url(#arrow)"/>

  <g>
    <rect x="1255" y="440" width="185" height="60" rx="6" fill="#ffffff" stroke="#4a4a4a" stroke-width="1.3"/>
    <text x="1347" y="465" font-size="13" fill="#2b2b2b" text-anchor="middle">Invoice</text>
    <text x="1347" y="482" font-size="13" fill="#2b2b2b" text-anchor="middle">Reconciliation</text>
  </g>

  <!-- Reconciliation -> Flagged / Error category -->
  <path d="M1347,500 L1347,560 L1500,560" stroke="#4a4a4a" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>

  <g>
    <rect x="1505" y="530" width="150" height="82" rx="6" fill="#ffffff" stroke="#4a4a4a" stroke-width="1.3"/>
    <text x="1580" y="552" font-size="12" fill="#2b2b2b" text-anchor="middle">Flagged / Correct</text>
    <text x="1580" y="568" font-size="12" fill="#2b2b2b" text-anchor="middle">Error Category</text>
    <text x="1580" y="584" font-size="12" fill="#2b2b2b" text-anchor="middle">Expected Total</text>
  </g>

  <!-- Flagged -> confidence, routed leftward-down since we are near right edge; bring Confidence box below, centered -->
  <path d="M1580,612 L1580,660 L900,660" stroke="#4a4a4a" stroke-width="1.4" fill="none"/>
  <circle cx="878" cy="660" r="15" fill="#ffffff" stroke="#2f5fa3" stroke-width="1.6"/>
  <text x="878" y="664" font-size="11" fill="#2f5fa3" text-anchor="middle" font-weight="600">U4</text>
  <text x="878" y="626" font-size="10.5" fill="#2f5fa3" text-anchor="middle" font-style="italic">Prediction</text>
  <line x1="863" y1="660" x2="770" y2="660" stroke="#4a4a4a" stroke-width="1.4" marker-end="url(#arrow)"/>

  <g>
    <rect x="590" y="630" width="180" height="60" rx="6" fill="#ffffff" stroke="#2f5fa3" stroke-width="1.8"/>
    <text x="680" y="665" font-size="14" font-weight="600" fill="#1f3f73" text-anchor="middle">Confidence</text>
  </g>

  <!-- ============ UNCERTAINTY PROPAGATION (dashed blue arcs to Confidence) ============ -->
  <path d="M582,165 C582,600 640,660 585,660" stroke="#2f5fa3" stroke-width="1.1" stroke-dasharray="2,4" fill="none" marker-end="url(#arrowBlue)"/>
  <path d="M907,335 C907,600 760,650 770,655" stroke="#2f5fa3" stroke-width="1.1" stroke-dasharray="2,4" fill="none" marker-end="url(#arrowBlue)"/>
  <path d="M1182,485 C1182,600 800,645 772,652" stroke="#2f5fa3" stroke-width="1.1" stroke-dasharray="2,4" fill="none" marker-end="url(#arrowBlue)"/>

  <!-- ============ EVIDENCE REQUIREMENTS (dashed grey, tied to nodes) ============ -->

  <!-- Invoice fields only -> Validity/Arithmetic Checks -->
  <line x1="430" y1="500" x2="430" y2="545" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3,3"/>
  <g>
    <rect x="300" y="548" width="260" height="70" rx="4" fill="#f7f8fa" stroke="#c7cbd1" stroke-width="1"/>
    <text x="430" y="565" font-size="10.5" font-weight="600" fill="#3a3a3a" text-anchor="middle">EVIDENCE — invoice fields only</text>
    <text x="430" y="581" font-size="10" fill="#5a5a5a" text-anchor="middle">validity, dates, arithmetic,</text>
    <text x="430" y="595" font-size="10" fill="#5a5a5a" text-anchor="middle">contract ID, duplicate IDs</text>
  </g>

  <!-- Contract + resolved service -> Contractual Pricing -->
  <line x1="1070" y1="350" x2="1070" y2="380" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3,3"/>
  <g>
    <rect x="935" y="383" width="270" height="70" rx="4" fill="#f7f8fa" stroke="#c7cbd1" stroke-width="1"/>
    <text x="1070" y="400" font-size="10.5" font-weight="600" fill="#3a3a3a" text-anchor="middle">EVIDENCE — contract + resolved service</text>
    <text x="1070" y="416" font-size="10" fill="#5a5a5a" text-anchor="middle">rates, unit basis, premiums,</text>
    <text x="1070" y="430" font-size="10" fill="#5a5a5a" text-anchor="middle">multipliers</text>
  </g>

  <!-- Reconciliation -> two evidence needs -->
  <line x1="1440" y1="470" x2="1440" y2="380" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="1440" y1="380" x2="1440" y2="380" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3,3"/>
  <g>
    <rect x="1310" y="180" width="270" height="70" rx="4" fill="#f7f8fa" stroke="#c7cbd1" stroke-width="1"/>
    <text x="1445" y="197" font-size="10.5" font-weight="600" fill="#3a3a3a" text-anchor="middle">EVIDENCE — relationships across items</text>
    <text x="1445" y="213" font-size="10" fill="#5a5a5a" text-anchor="middle">bundles, exclusions,</text>
    <text x="1445" y="227" font-size="10" fill="#5a5a5a" text-anchor="middle">duplicate billing</text>
  </g>
  <line x1="1445" y1="250" x2="1445" y2="450" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3,3"/>

  <g>
    <rect x="1310" y="255" width="270" height="70" rx="4" fill="#f7f8fa" stroke="#c7cbd1" stroke-width="1"/>
    <text x="1445" y="272" font-size="10.5" font-weight="600" fill="#3a3a3a" text-anchor="middle">EVIDENCE — chronological history</text>
    <text x="1445" y="288" font-size="10" fill="#5a5a5a" text-anchor="middle">complete billing history,</text>
    <text x="1445" y="302" font-size="10" fill="#5a5a5a" text-anchor="middle">cumulative volume discounts</text>
  </g>

</svg>
