<svg viewBox="0 0 1400 1080" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#333333"/>
    </marker>
  </defs>

  <rect width="1400" height="1080" fill="#ffffff"/>

  <!-- ===== Title ===== -->
  <text x="700" y="34" text-anchor="middle" font-size="15" font-weight="700" letter-spacing="2" fill="#111111">POSSIBLE APPROACHES</text>

  <!-- trunk -->
  <line x1="700" y1="44" x2="700" y2="70" stroke="#333333" stroke-width="1.5"/>
  <line x1="230" y1="70" x2="1170" y2="70" stroke="#333333" stroke-width="1.5"/>
  <line x1="230" y1="70" x2="230" y2="90" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="700" y1="70" x2="700" y2="90" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="1170" y1="70" x2="1170" y2="90" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===== Column 1 : End-to-End LLM ===== -->
  <g>
    <rect x="70" y="94" width="320" height="56" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.3"/>
    <text x="230" y="116" text-anchor="middle" font-size="13" font-weight="600" fill="#111111">End-to-End LLM /</text>
    <text x="230" y="134" text-anchor="middle" font-size="13" font-weight="600" fill="#111111">Agentic Auditor</text>

    <line x1="230" y1="150" x2="230" y2="176" stroke="#333333" stroke-width="1.3" marker-end="url(#arrow)"/>

    <rect x="60" y="182" width="340" height="150" rx="3" fill="#f7f9f7" stroke="#c9d6c9" stroke-width="1"/>
    <text x="76" y="205" font-size="12.5" fill="#1e5e20">+ Flexible over heterogeneous</text>
    <text x="88" y="221" font-size="12.5" fill="#1e5e20">contracts</text>

    <line x1="76" y1="238" x2="384" y2="238" stroke="#dde3dd" stroke-width="1"/>

    <text x="76" y="260" font-size="12.5" fill="#8a1f11">− Stochastic monetary</text>
    <text x="88" y="276" font-size="12.5" fill="#8a1f11">reasoning</text>
    <text x="76" y="296" font-size="12.5" fill="#8a1f11">− Reproducibility / calibration</text>
    <text x="88" y="312" font-size="12.5" fill="#8a1f11">/ runtime cost</text>
  </g>

  <!-- ===== Column 2 : Embedding Retrieval ===== -->
  <g>
    <rect x="540" y="94" width="320" height="56" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.3"/>
    <text x="700" y="116" text-anchor="middle" font-size="13" font-weight="600" fill="#111111">Embedding-Based</text>
    <text x="700" y="134" text-anchor="middle" font-size="13" font-weight="600" fill="#111111">Service Retrieval</text>

    <line x1="700" y1="150" x2="700" y2="176" stroke="#333333" stroke-width="1.3" marker-end="url(#arrow)"/>

    <rect x="530" y="182" width="340" height="150" rx="3" fill="#f7f9f7" stroke="#c9d6c9" stroke-width="1"/>
    <text x="546" y="205" font-size="12.5" fill="#1e5e20">+ Semantic matching of free</text>
    <text x="558" y="221" font-size="12.5" fill="#1e5e20">text</text>

    <line x1="546" y1="238" x2="854" y2="238" stroke="#dde3dd" stroke-width="1"/>

    <text x="546" y="260" font-size="12.5" fill="#8a1f11">− Similarity ≠ contractual</text>
    <text x="558" y="276" font-size="12.5" fill="#8a1f11">identity</text>
    <text x="546" y="296" font-size="12.5" fill="#8a1f11">− Cannot recover evidence</text>
    <text x="558" y="312" font-size="12.5" fill="#8a1f11">absent from description</text>
  </g>

  <!-- ===== Column 3 : Deterministic Rules ===== -->
  <g>
    <rect x="1010" y="94" width="320" height="56" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.3"/>
    <text x="1170" y="116" text-anchor="middle" font-size="13" font-weight="600" fill="#111111">Hospital-Specific</text>
    <text x="1170" y="134" text-anchor="middle" font-size="13" font-weight="600" fill="#111111">Deterministic Rules</text>

    <line x1="1170" y1="150" x2="1170" y2="176" stroke="#333333" stroke-width="1.3" marker-end="url(#arrow)"/>

    <rect x="1000" y="182" width="340" height="150" rx="3" fill="#f7f9f7" stroke="#c9d6c9" stroke-width="1"/>
    <text x="1016" y="205" font-size="12.5" fill="#1e5e20">+ Explainable</text>
    <text x="1016" y="225" font-size="12.5" fill="#1e5e20">+ Deterministic</text>

    <line x1="1016" y1="238" x2="1324" y2="238" stroke="#dde3dd" stroke-width="1"/>

    <text x="1016" y="260" font-size="12.5" fill="#8a1f11">− Poor reuse across hospitals</text>
    <text x="1016" y="296" font-size="12.5" fill="#8a1f11">− Repeated implementation</text>
  </g>

  <!-- ===== Merge into Design Requirements ===== -->
  <line x1="230" y1="332" x2="230" y2="360" stroke="#333333" stroke-width="1.3"/>
  <line x1="700" y1="332" x2="700" y2="360" stroke="#333333" stroke-width="1.3"/>
  <line x1="1170" y1="332" x2="1170" y2="360" stroke="#333333" stroke-width="1.3"/>
  <line x1="230" y1="360" x2="1170" y2="360" stroke="#333333" stroke-width="1.3"/>
  <line x1="700" y1="360" x2="700" y2="384" stroke="#333333" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- ===== Design Requirements box ===== -->
  <g>
    <rect x="480" y="390" width="440" height="150" rx="4" fill="#eef1fb" stroke="#3b4a8a" stroke-width="1.4"/>
    <text x="700" y="416" text-anchor="middle" font-size="13.5" font-weight="700" letter-spacing="1" fill="#22306a">DESIGN REQUIREMENTS</text>
    <line x1="510" y1="428" x2="890" y2="428" stroke="#3b4a8a" stroke-width="0.8"/>
    <text x="700" y="452" text-anchor="middle" font-size="12.5" fill="#22306a">Explainability · Reproducibility</text>
    <text x="700" y="474" text-anchor="middle" font-size="12.5" fill="#22306a">Explicit uncertainty</text>
    <text x="700" y="496" text-anchor="middle" font-size="12.5" fill="#22306a">Low runtime complexity</text>
    <text x="700" y="518" text-anchor="middle" font-size="12.5" fill="#22306a">Low runtime cost</text>
  </g>

  <line x1="700" y1="540" x2="700" y2="566" stroke="#333333" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- ===== Selected: Structured Hybrid ===== -->
  <g>
    <rect x="420" y="572" width="560" height="260" rx="5" fill="#ffffff" stroke="#166534" stroke-width="2.2"/>
    <text x="700" y="600" text-anchor="middle" font-size="14.5" font-weight="700" letter-spacing="1" fill="#166534">SELECTED — STRUCTURED HYBRID</text>
    <line x1="450" y1="614" x2="950" y2="614" stroke="#166534" stroke-width="1"/>

    <!-- internal flow -->
    <rect x="530" y="636" width="340" height="42" rx="3" fill="#f0faf1" stroke="#166534" stroke-width="1"/>
    <text x="700" y="662" text-anchor="middle" font-size="13" fill="#0f3d20">Interpretation</text>

    <line x1="700" y1="678" x2="700" y2="700" stroke="#166534" stroke-width="1.2" marker-end="url(#arrow)"/>

    <rect x="530" y="700" width="340" height="42" rx="3" fill="#f0faf1" stroke="#166534" stroke-width="1"/>
    <text x="700" y="726" text-anchor="middle" font-size="13" fill="#0f3d20">Shared Contract Schema</text>

    <line x1="700" y1="742" x2="700" y2="764" stroke="#166534" stroke-width="1.2" marker-end="url(#arrow)"/>

    <rect x="530" y="764" width="340" height="42" rx="3" fill="#f0faf1" stroke="#166534" stroke-width="1"/>
    <text x="700" y="790" text-anchor="middle" font-size="13" fill="#0f3d20">Deterministic Audit Execution</text>
  </g>

  <!-- ===== Footnote ===== -->
  <text x="700" y="885" text-anchor="middle" font-size="11.5" fill="#555555">Additional model complexity was adopted only where it added evidence or capability; once contracts were</text>
  <text x="700" y="903" text-anchor="middle" font-size="11.5" fill="#555555">structured, deterministic execution satisfied explainability, reproducibility, and runtime-cost requirements.</text>
  <text x="700" y="925" text-anchor="middle" font-size="11.5" fill="#555555">Embedding similarity was rejected where the distinguishing attribute was absent from the billing description —</text>
  <text x="700" y="943" text-anchor="middle" font-size="11.5" fill="#555555">no retrieval method can recover information that was never encoded in the source text.</text>

</svg>
